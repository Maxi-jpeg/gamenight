t:center;z-index:50;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}.modal-overlay.show{opacity:1;pointer-events:all}.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:340px;transform:scale(.94);transition:transform .2s;box-shadow:0 8px 32px rgba(0,0,0,.15)}.modal h3{font-family:'Black Ops One';font-size:20px;color:var(--accent);margin-bottom:8px;letter-spacing:1px}.modal p{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:20px}.modal-btns{display:flex;gap:8px}.modal-btns .btn{flex:1}.empty-state{text-align:center;padding:32px 16px;color:var(--muted);font-size:14px;line-height:1.7}.hist-tournament{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}.hist-t-title{font-family:'Black Ops One';font-size:15px;color:var(--accent);letter-spacing:1px}.hist-t-date{font-size:11px;color:var(--muted);margin:3px 0 8px}.hist-match{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--border);font-size:12px}.hist-match-teams{flex:1}.hist-match-winner{color:var(--green);font-weight:800}.hist-match-loser{color:var(--muted)}.hist-match-score{font-family:'Black Ops One';font-size:14px;color:var(--text)}.lb-row.rank-1{border-color:var(--accent);background:rgba(232,68,10,.04)}.lb-rank{font-family:'Black Ops One';font-size:20px;color:var(--muted);width:28px;text-align:center}.lb-record{font-size:13px}.lb-wins{color:var(--green);font-weight:800}.lb-losses{color:var(--red)}.lb-pct{font-size:11px;color:var(--muted);margin-top:2px}.team-player-chip{display:inline-block;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:13px;font-weight:700;margin:3px}.result-btns{display:flex;gap:10px;margin-top:10px}.result-btns .btn{flex:1;padding:14px}.btn-win{background:var(--green);color:#fff}.btn-lose{background:var(--red);color umns:1fr}.match-vs{margin:2px 0}.cups-row{grid-template-columns:1fr}.cup-sep{display:none}}

<script>
const STORE='game_night_extended_v1';
const TEAM_COLORS=['t1','t2','t3','t4','t5','t6'];

// FIREBASE SETUP
// 1) Create a Firebase project + Realtime Database.

// 3) Leave this as-is until you have the config; the app will keep using local storage.
// Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCNM8mUzNeWG0Q3CoEnrJiIC7NtHpsKbrk",
  authDomain: "gamenight-dafb6.firebaseapp.com",
  databaseURL: "https://gamenight-dafb6-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "gamenight-dafb6",
  storageBucket: "gamenight-dafb6.firebasestorage.app",
  messagingSenderId: "622004207361",
  appId: "1:622004207361:web:e7e77994f3bf454285e500",
  measurementId: "G-9076DNCNDD"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const FIREBASE_STATE_PATH='gameNight/state';
let firebaseRef=null;
let firebaseOnline=false;
let firebaseLoaded=false;
let applyingRemote=false;

let state={tab:'single',accounts:[],beerSingle:{selectedIds:[],current:null,matches:[]},beer:{selectedIds:[],activeTournament:null,tournaments:[]},flunky:{selectedIds:[],current:null,matches:[]},past:{type:'beerSingle',teamA:[],teamB:[],winner:'A'}};
function normalizeState(){state.beerSingle=state.beerSingle||{selectedIds:[],current:null,matches:[]};state.beer=state.beer||{selectedIds:[],activeTournament:null,tournaments:[]};state.flunky=state.flunky||{selectedIds:[],current:null,matches:[]};state.past=state.past||{type:'beerSingle',teamA:[],teamB:[],winner:'A'};state.accounts=state.accounts||[];state.tab=state.tab||'single'}
function hasFirebaseConfig(){return firebaseConfig.apiKey&&!firebaseConfig.apiKey.includes('PASTE_')&&firebaseConfig.projectId&&!firebaseConfig.projectId.includes('PASTE_')&&firebaseConfig.databaseURL&&!firebaseConfig.databaseURL.includes('PASTE_')}
function save(){localStorage.setItem(STORE,JSON.stringify(state));if(firebaseRef&&!applyingRemote){firebaseRef.set(state).catch(e=>{console.error(e);toast('Database save failed. Using local backup.')})}}
function load(){const raw=localStorage.getItem(STORE)||localStorage.getItem('game_night_accounts_v1');if(raw){try{state={...state,...JSON.parse(raw)}}catch(e){}}normalizeState()}
function initFirebase(){
  if(!hasFirebaseConfig()){updateSyncBadge('Local');return}
  try{
    if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
    firebaseRef=firebase.database().ref(FIREBASE_STATE_PATH);
    firebase.database().ref('.info/connected').on('value',snap=>{firebaseOnline=!!snap.val();updateSyncBadge(firebaseOnline?'Online':'Offline')});
    firebaseRef.on('value',snap=>{
      const remote=snap.val();
      applyingRemote=true;
      if(remote){state={...state,...remote};normalizeState();localStorage.setItem(STORE,JSON.stringify(state));}
      else{firebaseRef.set(state)}
      firebaseLoaded=true;
      applyingRemote=false;
      render();
    },err=>{console.error(err);updateSyncBadge('DB error');toast('Database connection failed.')});
  }catch(e){console.error(e);updateSyncBadge('Local');toast('Firebase config error. Using local mode.')}
}
function updateSyncBadge(label){const el=document.getElementById('badge');if(el)el.textContent=label==='Local'?`${state.accounts.length} accounts · Local`:label}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function fmtDate(iso){return new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
function fmtDateTime(iso){return new Date(iso).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>el.classList.remove('show'),2300)}
let _ma=null;function showModal(title,body,action,ok='Confirm'){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').textContent=body;document.getElementById('modalOk').textContent=ok;_ma=action;document.getElementById('modalOverlay').classList.add('show')}function closeModal(){document.getElementById('modalOverlay').classList.remove('show');_ma=null}function modalConfirm(){const action=_ma;closeModal();if(action)action()}document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});
function accName(id){return state.accounts.find(a=>a.id===id)?.name||'Deleted'}function names(ids){return ids.map(accName)}function shuffle(arr){return [...arr].sort(()=>Math.random()-.5)}function teamName(i){return 'Team '+(i+1)}
function setTab(tab){state.tab=tab;save();render()}
function render(){updateSyncBadge(firebaseRef?(firebaseOnline?'Online':'Offline'):'Local');const mainTabs=[['single','Beer Pong Game'],['tournament','Tournament'],['flunky','Flunky Ball'],['stats','Stats']];const moreTabs=['accounts','past','history','more'];const isMore=moreTabs.includes(state.tab);document.getElementById('tabs').innerHTML=mainTabs.map(([id,label])=>`<button class="tab ${state.tab===id?'active':''}" onclick="setTab('${id}')">${label}</button>`).join('')+`<button class="tab more-tab ${isMore?'active':''}" onclick="setTab('more')">More</button>`;({accounts:renderAccounts,single:renderBeerSingle,tournament:renderBeerTournament,flunky:renderFlunky,past:renderPastGame,stats:renderStats,history:renderHistory,more:renderMore})[state.tab]();}
function renderMore(){const cards=[['accounts','Accounts','Create or edit friend accounts for all games.'],['past','Add Past Result','Add games or tournament winners you forgot to enter live.'],['history','History','Review saved Beer Pong and Flunky Ball results.']];document.getElementById('content').innerHTML=`<div class="card"><div class="card-title">More</div><p class="muted">Less-used tools are kept here so the main game screen stays clean.</p></div><div class="more-grid">${cards.map(([id,title,sub])=>`<button class="more-card-btn" onclick="setTab('${id}')"><span><div class="more-card-title">${title}</div><div class="more-card-sub">${sub}</div></span><span class="more-card-arrow">›</span></button>`).join('')}</div>`}
function renderAccounts(){let html=`<div class="card"><div class="card-title">Friend Accounts</div><p class="muted">Create one account per friend. All wins are connected to these accounts, so yearly stats stay clean even when different groups play.</p><div class="row" style="margin-top:12px"><input class="input" id="newAcc" placeholder="Name" onkeydown="if(event.key==='Enter')addAccount()"><button class="btn btn-primary" onclick="addAccount()">Add</button></div></div>`;if(!state.accounts.length)html+=`<div class="empty-state">No accounts yet.</div>`;else html+=`<div class="card"><div class="card-title">All Accounts</div><div class="stack">${state.accounts.map(a=>`<div class="player-item"><div class="lb-name">${a.name}</div><button class="btn btn-danger" onclick="removeAccount('${a.id}')">×</button></div>`).join('')}</div></div>`;document.getElementById('content').innerHTML=html}
function addAccount(){const inp=document.getElementById('newAcc'),name=inp.value.trim();if(!name){toast('Enter a name.');return}if(state.accounts.some(a=>a.name.toLowerCase()===name.toLowerCase())){toast('This account already exists.');return}state.accounts.push({id:uid(),name,createdAt:new Date().toISOString()});inp.value='';save();render();toast('Account added.')}
function removeAccount(id){showModal('Remove account?','Old results stay, but the account disappears from new games.',()=>{state.accounts=state.accounts.filter(a=>a.id!==id);['beerSingle','beer','flunky'].forEach(k=>{if(state[k].selectedIds)state[k].selectedIds=state[k].selectedIds.filter(x=>x!==id)});save();render()},'Remove')}
function selector(kind,min,exactEven=false){const selected=state[kind].selectedIds||[];let help=`Select players for this game.`;if(min)help+=` Minimum: ${min}.`;if(exactEven)help+=' Select an even number.';return `<div class="card"><div class="card-title">Active Players</div><p class="muted">${help}</p>${!state.accounts.length?'<div class="empty-state">Create accounts first.</div>':`<div class="account-grid" style="margin-top:12px">${state.accounts.map(a=>`<button class="account-chip ${selected.includes(a.id)?'active':''}" onclick="toggleSelected('${kind}','${a.id}')"><span>${a.name}</span><small>${selected.includes(a.id)?'selected':'add'}</small></button>`).join('')}</div><div class="row" style="margin-top:10px"><button class="btn btn-ghost btn-sm" onclick="selectAll('${kind}')">Select all</button><button class="btn btn-ghost btn-sm" onclick="clearSelected('${kind}')">Clear</button></div>`}</div>`}
function toggleSelected(kind,id){const arr=state[kind].selectedIds;if(arr.includes(id))state[kind].selectedIds=arr.filter(x=>x!==id);else state[kind].selectedIds.push(id);save();render()}
function selectAll(kind){state[kind].selectedIds=state.accounts.map(a=>a.id);save();render()}function clearSelected(kind){state[kind].selectedIds=[];save();render()}
function cupsHTML(a,b,la='Team A',lb='Team B'){return `<div class="cups-row"><div class="cup-input-wrap"><div class="cup-label">${la} cups left</div><input class="cup-input" type="number" min="0" max="10" id="${a}" inputmode="numeric"></div><div class="cup-sep">-</div><div class="cup-input-wrap"><div class="cup-label">${lb} cups left</div><input class="cup-input" type="number" min="0" max="10" id="${b}" inputmode="numeric"></div></div>`}
function readCups(aId,bId){const a=parseInt(document.getElementById(aId)?.value),b=parseInt(document.getElementById(bId)?.value);if(Number.isNaN(a)||Number.isNaN(b)||a<0||b<0||a>10||b>10)return null;if(a===b)return 'draw';return{a,b}}
function matchRow(teamA,teamB,labelA='Team A',labelB='Team B'){return `<div class="match-teams-row"><div class="match-team"><div class="match-team-name" style="color:var(--blue)">${labelA}</div><div class="match-team-players">${names(teamA).join(' & ')}</div></div><div class="match-vs">VS</div><div class="match-team"><div class="match-team-name" style="color:var(--red)">${labelB}</div><div class="match-team-players">${names(teamB).join(' & ')}</div></div></div>`}
function renderBeerSingle(){let html=selector('beerSingle',4,true);const cur=state.beerSingle.current;if(!cur){html+=`<div class="card"><div class="card-title">Single Beer Pong Game</div><p class="muted">Use this when there is no time for a full tournament. Draw teams randomly from selected accounts or build Team A and Team B by clicking names.</p><button class="btn btn-primary btn-full" onclick="drawBeerSingle()">Draw Random Teams</button><button class="btn btn-ghost btn-full" onclick="manualBeerSingle()">Choose Teams Manually</button></div>`}else if(cur.picking){html+=manualBeerSingleHTML(cur)}else{html+=`<div class="card"><div class="card-title">Current Single Game</div><div class="info-box"><strong>Cup entry:</strong> enter the cups still standing on each team's own side. The team with more cups left is counted as the winner. Example: Team A has 4 cups left, Team B has 0, so Team A wins.</div>${matchRow(cur.teamA,cur.teamB)}${cupsHTML('sgA','sgB','Team A','Team B')}<button class="btn btn-primary save-match-btn" onclick="saveBeerSingle()">Save Result</button><button class="btn btn-ghost btn-full" onclick="cancelBeerSingle()">Cancel</button></div>`}document.getElementById('content').innerHTML=html}
function drawBeerSingle(){const ids=state.beerSingle.selectedIds;if(ids.length<4){toast('Select at least 4 players.');return}if(ids.length%2!==0){toast('Select an even number of players.');return}const s=shuffle(ids),half=s.length/2;state.beerSingle.current={id:uid(),date:new Date().toISOString(),teamA:s.slice(0,half),teamB:s.slice(half),manual:false};save();render()}
function manualBeerSingle(){const ids=state.beerSingle.selectedIds;if(ids.length<2){toast('Select at least 2 active players first.');return}state.beerSingle.current={id:uid(),date:new Date().toISOString(),teamA:[],teamB:[],manual:true,picking:true};save();render()}
function manualBeerSingleHTML(cur){const selected=state.beerSingle.selectedIds;return `<div class="card"><div class="card-title">Choose Single Game Teams</div><p class="muted">Click a name to move it between Team A, Team B and unassigned. Both teams need at least one player.</p><div class="manual-team-grid"><div class="manual-team-box"><div class="manual-team-title" style="color:var(--blue)">Team A</div>${cur.teamA.length?cur.teamA.map(id=>`<button class="pick-chip a" onclick="toggleSingleManual('${id}')">${accName(id)}</button>`).join(''):'<p class="muted">No players yet.</p>'}</div><div class="manual-team-box"><div class="manual-team-title" style="color:var(--red)">Team B</div>${cur.teamB.length?cur.teamB.map(id=>`<button class="pick-chip b" onclick="toggleSingleManual('${id}')">${accName(id)}</button>`).join(''):'<p class="muted">No players yet.</p>'}</div></div><div style="margin-top:12px"><div class="manual-team-title">Available Players</div>${selected.length?selected.map(id=>{const cls=cur.teamA.includes(id)?'a':cur.teamB.includes(id)?'b':'';const tag=cur.teamA.includes(id)?'Team A':cur.teamB.includes(id)?'Team B':'add';return `<button class="pick-chip ${cls}" onclick="toggleSingleManual('${id}')"><span>${accName(id)}</span><small style="float:right">${tag}</small></button>`}).join(''):'<p class="muted">No active players selected.</p>'}</div><button class="btn btn-primary btn-full" onclick="startManualBeerSingle()">Start Single Game</button><button class="btn btn-ghost btn-full" onclick="cancelBeerSingle()">Cancel</button></div>`}
function toggleSingleManual(id){const cur=state.beerSingle.current;if(!cur)return;if(cur.teamA.includes(id)){cur.teamA=cur.teamA.filter(x=>x!==id);cur.teamB.push(id)}else if(cur.teamB.includes(id)){cur.teamB=cur.teamB.filter(x=>x!==id)}else{cur.teamA.push(id)}save();render()}
function startManualBeerSingle(){const cur=state.beerSingle.current;if(!cur?.teamA.length||!cur?.teamB.length){toast('Both teams need players.');return}cur.picking=false;save();render()}
function manualNamesToAccounts(text){return text.split(',').map(x=>x.trim()).filter(Boolean).map(name=>{let acc=state.accounts.find(a=>a.name.toLowerCase()===name.toLowerCase());if(!acc){acc={id:uid(),name,createdAt:new Date().toISOString()};state.accounts.push(acc)}return acc.id})}
function saveBeerSingle(){const cur=state.beerSingle.current;if(cur?.picking){toast('Start the game first.');return}const cups=readCups('sgA','sgB');if(!cups){toast('Enter cup counts from 0 to 10.');return}if(cups==='draw'){toast('Cups must differ.');return}const winner=cups.a>cups.b?'A':'B';state.beerSingle.matches.unshift({...cur,cupsA:cups.a,cupsB:cups.b,winner});state.beerSingle.current=null;save();render();toast('Single game saved.')}
function cancelBeerSingle(){state.beerSingle.current=null;save();render()}
function renderBeerTournament(){let html=selector('beer',4,true);const t=state.beer.activeTournament;if(!t){const count=state.beer.selectedIds.length;html+=`<div class="card"><div class="card-title">New Beer Pong Tournament</div><p class="muted">Choose any even number of players. The app creates teams of 2, builds a round robin group phase, then sends the top 2 teams to the final. If the final spots are tied on wins and cup difference, a decider round appears.</p><div class="muted" style="margin-top:10px">Selected: <strong>${count}</strong> players = <strong>${Math.floor(count/2)}</strong> teams</div><button class="btn btn-primary btn-full" onclick="startTournament()">Start Tournament</button></div>`}else html+=tournamentHTML(t);document.getElementById('content').innerHTML=html}
function startTournament(){const ids=state.beer.selectedIds;if(ids.length<4){toast('Select at least 4 players.');return}if(ids.length%2!==0){toast('Select an even number of players.');return}const s=shuffle(ids),teams=[];for(let i=0;i<s.length;i+=2)teams.push([s[i],s[i+1]]);const matches=[];for(let i=0;i<teams.length;i++)for(let j=i+1;j<teams.length;j++)matches.push({tA:i,tB:j,cupsA:null,cupsB:null,winner:null,phase:'group'});state.beer.activeTournament={id:uid(),date:new Date().toISOString(),teams,matches,decider:null,final:null,champion:null};save();render()}
function tournamentHTML(t){let html=`<div class="card"><div class="card-title">Cup Entry Logic</div><div class="info-box"><strong>How to enter cups:</strong> enter the cups still standing on each team's own side after the match. The team with more cups left is counted as the winner. Example: Team 1 has 5 cups left and Team 2 has 0 cups left → Team 1 wins.</div></div><div class="card"><div class="card-title">Tournament Teams</div><div class="team-builder">${t.teams.map((team,i)=>`<div class="team-slot"><div class="team-dot ${TEAM_COLORS[i%TEAM_COLORS.length]}"></div><div class="team-slot-name">${teamName(i)}</div><div class="team-slot-players">${names(team).join(' & ')}</div></div>`).join('')}</div><button class="btn btn-ghost btn-full" onclick="abortTournament()">Abort Tournament</button></div>`;html+=standingsCard(t);html+=`<div class="card"><div class="card-title">Group Phase</div>`;t.matches.forEach((m,i)=>html+=renderTournamentMatch(t,m,i,'group'));html+=`</div>`;if(groupDone(t)){const dec=deciderInfo(t);if(dec.needed){html+=deciderHTML(t,dec)}else{html+=finalHTML(t,dec.finalists)}}return html}
function renderTournamentMatch(t,m,i,type){const done=m.winner!==null;let idA=type+i+'A',idB=type+i+'B';let html=`<div class="match-card ${done?'done':''}"><div class="match-header"><span class="match-label">${type==='group'?'Match':'Decider'} ${i+1}</span>${done?'<span class="match-done-badge">Done</span>':''}</div>${matchRow(t.teams[m.tA],t.teams[m.tB],teamName(m.tA),teamName(m.tB))}`;if(done){const wc=m.winner===m.tA?m.cupsA:m.cupsB,lc=m.winner===m.tA?m.cupsB:m.cupsA;html+=`<div class="match-result"><span class="result-winner">${names(t.teams[m.winner]).join(' & ')} won</span><span class="result-score">${wc}-${lc}</span></div><button class="btn btn-ghost btn-sm" style="margin-top:8px;width:100%" onclick="editTMatch('${type}',${i})">Edit</button>`}else{html+=cupsHTML(idA,idB,teamName(m.tA),teamName(m.tB))+`<button class="btn btn-primary save-match-btn" onclick="saveTMatch('${type}',${i},'${idA}','${idB}')">Save Result</button>`}return html+`</div>`}
function saveTMatch(type,i,aId,bId){const cups=readCups(aId,bId);if(!cups){toast('Enter cup counts from 0 to 10.');return}if(cups==='draw'){toast('Cups must differ.');return}const t=state.beer.activeTournament,m=type==='group'?t.matches[i]:t.decider.matches[i];m.cupsA=cups.a;m.cupsB=cups.b;m.winner=cups.a>cups.b?m.tA:m.tB;if(type==='group'){t.decider=null;t.final=null;t.champion=null}else{t.final=null;t.champion=null}save();render()}
function editTMatch(type,i){const t=state.beer.activeTournament,m=type==='group'?t.matches[i]:t.decider.matches[i];m.cupsA=m.cupsB=null;m.winner=null;if(type==='group'){t.decider=null;t.final=null;t.champion=null}else{t.final=null;t.champion=null}save();render()}
function groupDone(t){return t.matches.every(m=>m.winner!==null)}
function standings(t,matches=t.matches,teamIdxs=null){const idxs=teamIdxs||t.teams.map((_,i)=>i);const st=idxs.map(i=>({idx:i,w:0,l:0,cd:0}));const by=Object.fromEntries(st.map(s=>[s.idx,s]));matches.forEach(m=>{if(m.winner===null)return;const loser=m.winner===m.tA?m.tB:m.tA;if(by[m.winner])by[m.winner].w++;if(by[loser])by[loser].l++;const wc=m.winner===m.tA?m.cupsA:m.cupsB,lc=m.winner===m.tA?m.cupsB:m.cupsA;if(by[m.winner])by[m.winner].cd+=wc-lc;if(by[loser])by[loser].cd-=wc-lc});return st.sort((a,b)=>b.w-a.w||b.cd-a.cd)}
function sameRank(a,b){return a&&b&&a.w===b.w&&a.cd===b.cd}function better(a,b){return a.w>b.w||(a.w===b.w&&a.cd>b.cd)}
function deciderInfo(t){const st=standings(t);if(st.length<=2)return{needed:false,finalists:st.map(s=>s.idx)};const cutoff=st[1];const above=st.filter(s=>better(s,cutoff)).map(s=>s.idx);const tied=st.filter(s=>sameRank(s,cutoff)).map(s=>s.idx);const slots=2-above.length;if(tied.length>slots){return{needed:true,above,tied,slots}}return{needed:false,finalists:st.slice(0,2).map(s=>s.idx)}}
function deciderHTML(t,info){if(!t.decider||JSON.stringify(t.decider.tied)!==JSON.stringify(info.tied)){const matches=[];for(let i=0;i<info.tied.length;i++)for(let j=i+1;j<info.tied.length;j++)matches.push({tA:info.tied[i],tB:info.tied[j],cupsA:null,cupsB:null,winner:null,phase:'decider'});t.decider={tied:info.tied,above:info.above,slots:info.slots,matches};save()}let html=`<div class="phase-divider"><div class="phase-divider-line"></div><div class="phase-divider-label">Decider Round</div><div class="phase-divider-line"></div></div><div class="card"><div class="card-title">Decider Round</div><p class="muted">These teams are tied for the final spots: ${info.tied.map(i=>names(t.teams[i]).join(' & ')).join(' / ')}.</p>`;t.decider.matches.forEach((m,i)=>html+=renderTournamentMatch(t,m,i,'decider'));html+=`</div>`;if(t.decider.matches.every(m=>m.winner!==null)){const dst=standings(t,t.decider.matches,info.tied);const finalists=[...info.above,...dst.slice(0,info.slots).map(s=>s.idx)];html+=finalHTML(t,finalists)}return html}
function finalHTML(t,finalists){if(finalists.length<2)return'';const f=t.final;let html=`<div class="phase-divider"><div class="phase-divider-line"></div><div class="phase-divider-label">Final</div><div class="phase-divider-line"></div></div>`;if(f?.winner!==null&&f?.winner!==undefined)html+=`<div class="champ-banner"><div class="champ-name">${names(t.teams[f.winner]).join(' & ')}</div><div class="muted">Tournament champions</div></div>`;const m=f||{tA:finalists[0],tB:finalists[1],cupsA:null,cupsB:null,winner:null};html+=`<div class="card"><div class="card-title">Final</div><div class="match-card final-card ${m.winner!==null?'done':''}">${matchRow(t.teams[m.tA],t.teams[m.tB],teamName(m.tA),teamName(m.tB))}`;if(m.winner!==null&&m.winner!==undefined){const wc=m.winner===m.tA?m.cupsA:m.cupsB,lc=m.winner===m.tA?m.cupsB:m.cupsA;html+=`<div class="match-result"><span class="result-winner">${names(t.teams[m.winner]).join(' & ')} won</span><span class="result-score">${wc}-${lc}</span></div><button class="btn btn-ghost btn-full" onclick="editFinal()">Edit Final</button><button class="btn btn-primary btn-full" onclick="finishTournament()">Finish and Save Tournament</button>`}else{html+=cupsHTML('finA','finB',teamName(m.tA),teamName(m.tB))+`<button class="btn btn-primary save-match-btn" onclick="saveFinal(${m.tA},${m.tB})">Save Final</button>`}return html+`</div></div>`}
function saveFinal(a,b){const cups=readCups('finA','finB');if(!cups){toast('Enter cup counts from 0 to 10.');return}if(cups==='draw'){toast('Cups must differ.');return}const winner=cups.a>cups.b?a:b;const t=state.beer.activeTournament;t.final={tA:a,tB:b,cupsA:cups.a,cupsB:cups.b,winner};t.champion=winner;save();render()}
function editFinal(){const t=state.beer.activeTournament;t.final=null;t.champion=null;save();render()}function finishTournament(){const t=state.beer.activeTournament;if(!t?.final||t.final.winner===null){toast('Final is not complete.');return}state.beer.tournaments.unshift(t);state.beer.activeTournament=null;save();render();toast('Tournament saved.')}function abortTournament(){showModal('Abort tournament?','Current tournament results will be lost.',()=>{state.beer.activeTournament=null;save();render()},'Abort')}
function standingsCard(t){const st=standings(t);let html=`<div class="card"><div class="card-title">Standings</div><table class="standings"><thead><tr><th>#</th><th>Team</th><th>W</th><th>L</th><th>Cup Diff</th></tr></thead><tbody>`;st.forEach((s,i)=>html+=`<tr><td class="s-rank">${i+1}</td><td class="s-team"><div>${teamName(s.idx)}</div><div style="font-size:11px;color:var(--muted)">${names(t.teams[s.idx]).join(' & ')}</div></td><td class="s-w">${s.w}</td><td class="s-l">${s.l}</td><td class="s-cd ${s.cd>0?'pos':s.cd<0?'neg':''}">${s.cd>0?'+':''}${s.cd}</td></tr>`);return html+`</tbody></table></div>`}
function renderFlunky(){let html=selector('flunky',6);const ct=state.flunky.current;if(!ct){html+=`<div class="card"><div class="card-title">New Flunky Ball Match</div><p class="muted">Select at least 6 players. The app draws two teams of 3.</p><button class="btn btn-primary btn-full" onclick="flunkyDraw()">Draw Teams</button></div>`}else{html+=`<div class="card"><div class="card-title">Current Flunky Ball Match</div>${matchRow(ct.teamA,ct.teamB,'Team Alpha','Team Beta')}<div class="result-btns"><button class="btn btn-win" onclick="flunkySave('A')">Alpha Won</button><button class="btn btn-lose" onclick="flunkySave('B')">Beta Won</button></div><button class="btn btn-ghost btn-full" onclick="flunkyCancel()">Cancel</button></div>`}document.getElementById('content').innerHTML=html}
function flunkyDraw(){const ids=state.flunky.selectedIds;if(ids.length<6){toast('Select at least 6 players.');return}const s=shuffle(ids);state.flunky.current={id:uid(),date:new Date().toISOString(),teamA:s.slice(0,3),teamB:s.slice(3,6)};save();render()}function flunkySave(winner){const ct=state.flunky.current;if(!ct)return;state.flunky.matches.unshift({...ct,winner});state.flunky.current=null;save();render();toast('Flunky Ball result saved.')}function flunkyCancel(){state.flunky.current=null;save();render()}

function renderPastGame(){const p=state.past||{type:'beerSingle',teamA:[],teamB:[],winner:'A'};const type=p.type||'beerSingle';const isBeer=type==='beerSingle';const isFlunky=type==='flunky';const isTournament=type==='beerTournament';let html=`<div class="card"><div class="card-title">Add Past Result</div><p class="muted">Use this when you already played but nobody had a phone ready. For a past tournament you only need to add the winning player or winning team.</p><select id="pastType" onchange="setPastType(this.value)"><option value="beerSingle" ${isBeer?'selected':''}>Beer Pong single game</option><option value="flunky" ${isFlunky?'selected':''}>Flunky Ball match</option><option value="beerTournament" ${isTournament?'selected':''}>Beer Pong tournament winner only</option></select></div>`;if(isTournament){html+=`<div class="card"><div class="card-title">Tournament Winner</div><p class="muted">Click the winner account(s). If the tournament was won by a two-person Beer Pong team, select both names.</p><div style="margin-top:12px">${state.accounts.length?state.accounts.map(a=>{const active=p.teamA.includes(a.id);return `<button class="pick-chip ${active?'a':''}" onclick="togglePastTournamentWinner('${a.id}')"><span>${a.name}</span><small style="float:right">${active?'Winner':'add'}</small></button>`}).join(''):'<p class="muted">Create accounts first.</p>'}</div><input class="input" id="pastDate" type="datetime-local" style="margin-top:12px" value="${p.dateLocal||''}"><button class="btn btn-primary btn-full" onclick="savePastGame()">Save Past Tournament</button><button class="btn btn-ghost btn-full" onclick="clearPastGame()">Clear</button></div>`;document.getElementById('content').innerHTML=html;return}html+=`<div class="card"><div class="card-title">Teams</div><div class="manual-team-grid"><div class="manual-team-box"><div class="manual-team-title" style="color:var(--blue)">Team A</div>${p.teamA.length?p.teamA.map(id=>`<button class="pick-chip a" onclick="cyclePastPlayer('${id}')">${accName(id)}</button>`).join(''):'<p class="muted">No players yet.</p>'}</div><div class="manual-team-box"><div class="manual-team-title" style="color:var(--red)">Team B</div>${p.teamB.length?p.teamB.map(id=>`<button class="pick-chip b" onclick="cyclePastPlayer('${id}')">${accName(id)}</button>`).join(''):'<p class="muted">No players yet.</p>'}</div></div><div style="margin-top:12px"><div class="manual-team-title">Accounts</div>${state.accounts.length?state.accounts.map(a=>{const cls=p.teamA.includes(a.id)?'a':p.teamB.includes(a.id)?'b':'';const tag=p.teamA.includes(a.id)?'Team A':p.teamB.includes(a.id)?'Team B':'add';return `<button class="pick-chip ${cls}" onclick="cyclePastPlayer('${a.id}')"><span>${a.name}</span><small style="float:right">${tag}</small></button>`}).join(''):'<p class="muted">Create accounts first.</p>'}</div></div>`;html+=`<div class="card"><div class="card-title">Result</div><p class="muted">Pick the winning team. For Beer Pong, also enter the cups left on each team's own side.</p><div class="result-btns"><button class="btn ${p.winner==='A'?'btn-win':'btn-ghost'}" onclick="setPastWinner('A')">Team A Won</button><button class="btn ${p.winner==='B'?'btn-lose':'btn-ghost'}" onclick="setPastWinner('B')">Team B Won</button></div>${isBeer?`<div class="info-box"><strong>Cup entry:</strong> more cups left = winner. Example: winner has 4 cups left, loser has 0.</div>${cupsHTML('pastA','pastB','Team A','Team B')}`:''}<input class="input" id="pastDate" type="datetime-local" style="margin-top:12px" value="${p.dateLocal||''}"><button class="btn btn-primary btn-full" onclick="savePastGame()">Save Past Game</button><button class="btn btn-ghost btn-full" onclick="clearPastGame()">Clear</button></div>`;document.getElementById('content').innerHTML=html}
function setPastType(type){state.past={type,teamA:[],teamB:[],winner:'A'};save();render()}
function togglePastTournamentWinner(id){const p=state.past;if(!p.teamA)p.teamA=[];p.teamA=p.teamA.includes(id)?p.teamA.filter(x=>x!==id):[...p.teamA,id];save();render()}
function cyclePastPlayer(id){const p=state.past;if(p.teamA.includes(id)){p.teamA=p.teamA.filter(x=>x!==id);p.teamB.push(id)}else if(p.teamB.includes(id)){p.teamB=p.teamB.filter(x=>x!==id)}else{p.teamA.push(id)}save();render()}
function setPastWinner(w){state.past.winner=w;const d=document.getElementById('pastDate')?.value;if(d)state.past.dateLocal=d;save();render()}
function localDateToIso(v){return v?new Date(v).toISOString():new Date().toISOString()}
function savePastGame(){const p=state.past;const date=localDateToIso(document.getElementById('pastDate')?.value);if(p.type==='beerTournament'){if(!p.teamA?.length){toast('Choose at least one tournament winner.');return}state.beer.tournaments.unshift({id:uid(),date,teams:[... [p.teamA]],matches:[],tiebreakers:[],final:null,champion:0,past:true});state.past={type:p.type,teamA:[],teamB:[],winner:'A'};save();render();toast('Past tournament saved.');return}if(!p.teamA.length||!p.teamB.length){toast('Both teams need players.');return}if(p.type==='beerSingle'){const cups=readCups('pastA','pastB');if(!cups){toast('Enter cup counts from 0 to 10.');return}if(cups==='draw'){toast('Cups must differ.');return}const expected=cups.a>cups.b?'A':'B';if(expected!==p.winner){toast('Winner must be the team with more cups left.');return}state.beerSingle.matches.unshift({id:uid(),date,teamA:[...p.teamA],teamB:[...p.teamB],winner:p.winner,cupsA:cups.a,cupsB:cups.b,past:true})}else{state.flunky.matches.unshift({id:uid(),date,teamA:[...p.teamA],teamB:[...p.teamB],winner:p.winner,past:true})}state.past={type:p.type,teamA:[],teamB:[],winner:'A'};save();render();toast('Past game saved.')}
function clearPastGame(){state.past={type:state.past?.type||'beerSingle',teamA:[],teamB:[],winner:'A'};save();render()}

function statsFor(id){let flunkyWins=0,beerGameWins=0,beerTournamentWins=0,flunkyLosses=0,beerGameLosses=0,beerTournamentFinals=0;state.flunky.matches.forEach(m=>{const win=m.winner==='A'?m.teamA:m.teamB,lose=m.winner==='A'?m.teamB:m.teamA;if(win.includes(id))flunkyWins++;if(lose.includes(id))flunkyLosses++});state.beerSingle.matches.forEach(m=>{const win=m.winner==='A'?m.teamA:m.teamB,lose=m.winner==='A'?m.teamB:m.teamA;if(win.includes(id))beerGameWins++;if(lose.includes(id))beerGameLosses++});state.beer.tournaments.forEach(t=>{if(t.champion!==null&&t.teams[t.champion]?.includes(id))beerTournamentWins++;const f=t.final;if(f){if(t.teams[f.tA]?.includes(id)||t.teams[f.tB]?.includes(id))beerTournamentFinals++}});return{flunkyWins,beerGameWins,beerTournamentWins,flunkyLosses,beerGameLosses,beerTournamentFinals}}
function renderStats(){if(!state.accounts.length){document.getElementById('content').innerHTML='<div class="empty-state">No accounts yet.</div>';return}const rows=state.accounts.map(a=>({id:a.id,name:a.name,...statsFor(a.id)})).sort((a,b)=>b.beerTournamentWins-a.beerTournamentWins||b.beerGameWins-a.beerGameWins||b.flunkyWins-a.flunkyWins);let html=`<div class="card"><div class="card-title">All-Time Stats</div><p class="muted">Main yearly counters: Flunky Ball wins, Beer Pong single-game wins, and Beer Pong tournament wins.</p><div class="leaderboard" style="margin-top:12px">`;rows.forEach((r,i)=>html+=`<div class="lb-row ${i===0?'rank-1':''}"><div class="lb-rank">${i+1}</div><div class="lb-name"><div>${r.name}</div></div><div class="lb-record"><div><span class="lb-wins">${r.flunkyWins}</span> Flunky</div><div><span class="lb-wins">${r.beerGameWins}</span> BP games</div><div><span class="lb-wins">${r.beerTournamentWins}</span> BP tourn.</div></div></div>`);html+=`</div></div><div class="card"><div class="card-title">Detailed Table</div><table class="standings"><thead><tr><th>Player</th><th>Flunky Wins</th><th>BP Game Wins</th><th>BP Tournament Wins</th></tr></thead><tbody>`;rows.forEach(r=>html+=`<tr><td class="s-team">${r.name}</td><td class="s-w">${r.flunkyWins}</td><td class="s-w">${r.beerGameWins}</td><td class="s-w">${r.beerTournamentWins}</td></tr>`);html+=`</tbody></table></div>`;document.getElementById('content').innerHTML=html}
function renderHistory(){let html='';if(state.beerSingle.matches.length){html+=`<div class="card"><div class="card-title">Beer Pong Single Games</div></div>`+state.beerSingle.matches.map(m=>histMatch('Beer Pong Game',m,m.winner==='A'?m.teamA:m.teamB,m.winner==='A'?m.teamB:m.teamA,`${m.winner==='A'?m.cupsA:m.cupsB}-${m.winner==='A'?m.cupsB:m.cupsA}`)).join('')}if(state.beer.tournaments.length){html+=`<div class="card"><div class="card-title">Beer Pong Tournaments</div></div>`+state.beer.tournaments.map((t,i)=>`<div class="hist-tournament"><div class="hist-t-title">Tournament #${state.beer.tournaments.length-i}</div><div class="hist-t-date">${fmtDate(t.date)}</div><div class="hist-match-winner">${names(t.teams[t.champion]||[]).join(' & ')}</div><div class="hist-match-loser">${t.past?'Past tournament winner only':t.teams.length+' teams'}</div></div>`).join('')}if(state.flunky.matches.length){html+=`<div class="card"><div class="card-title">Flunky Ball Matches</div></div>`+state.flunky.matches.map(m=>histMatch('Flunky Ball',m,m.winner==='A'?m.teamA:m.teamB,m.winner==='A'?m.teamB:m.teamA,'')).join('')}document.getElementById('content').innerHTML=html||'<div class="empty-state">No saved games yet.</div>'}
function histMatch(title,m,win,lose,score){return`<div class="hist-tournament"><div class="hist-t-title">${title}</div><div class="hist-t-date">${fmtDateTime(m.date)}</div><div class="hist-match"><div class="hist-match-teams"><div class="hist-match-winner">${names(win).join(', ')}</div><div class="hist-match-loser">vs ${names(lose).join(', ')}</div></div><div class="hist-match-score">${score}</div></div></div>`}
load();render();initFirebase();
</script></body></html>
